# .github/workflows/build.yml — the M6 packaging pipeline.
#
# Builds the cross-platform desktop binary (core + vision + ocr + the windowed host +
# the bundled Piper voice) and ships, per OS, ONE native package (a single file, no
# folder for the user to handle):
#   * Linux  -> OwnVoiceReader-x86_64.AppImage  (run it anywhere, no install) AND
#               ownvoicereader_0.1.0_amd64.deb   (the native one-click Ubuntu/Debian
#                                               installer: double-click -> install)
#   * macOS  -> OwnVoiceReader-<arch>.dmg        (a .app + /Applications, drag-to-install)
#   * Windows-> OwnVoiceReader-Setup-x86_64.exe  (a single Inno Setup installer)
#
# The binary is a single self-contained executable (no folder the user handles): the
# app re-runs itself in a Piper mode for TTS, so there is no sibling piper exe, and the
# macOS bundle is a real .app. Binaries land ONLY here on the GitHub Release page — git
# stays lean: the 63 MB voice travels via Git LFS, and no build output is ever committed
# (see .gitignore).
#
# Triggers:
#   * push of a v* tag  -> build every OS + publish a release.
#   * workflow_dispatch  -> build every OS + upload artifacts (downloadable from the run
#                           page) WITHOUT publishing (a manual / pipeline check).
#
# Python 3.12 is the conservative choice for third-party wheel availability
# (piper-tts / rapidocr); the local dev env is 3.13 — bump PYTHON_VERSION to align
# once the wheels confirm.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read   # release job overrides to write (to create the release)

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------
  # 1) The unit + integration suite (the ~250 tests, incl. the A6 local-only
  #    invariant). Ubuntu only — the tests don't need a window/display. A green
  #    build requires a green test.
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the LFS voice)
        uses: actions/checkout@v4
        with:
          lfs: true   # fetch the 63 MB voice (it's a 133-byte pointer in git)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (core + vision + ocr + desktop + test)
        run: |
          python -m pip install --upgrade pip
          pip install ".[server,ocr,vision,desktop]" pytest
      - name: Test suite (exit 0 == green)
        run: python -m pytest

  # --------------------------------------------------------------------------
  # 2) The cross-platform build — one job per OS. Each produces the single native
  #    package, smokes the bundled TTS, then uploads it as an artifact.
  # --------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one OS failing shouldn't cancel the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Release build flags (the spec reads these at build time):
      #   OV_CONSOLE=0 -> a silent GUI build (the release default; OV_CONSOLE=1 is the
      #                   debuggable console twin for --auto / local dev)
      #   OV_ICON      -> the .icns for the macOS .app (generated below; ignored off-mac)
      OV_CONSOLE: "0"
      OV_ICON: "ownvoicereader/viewer/imgs/ownvoicereader.icns"
    steps:
      - name: Checkout (with the LFS voice)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (core + vision + ocr + desktop + pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install ".[server,ocr,vision,desktop]" pyinstaller

      - name: Make the .icns (macOS)
        if: ${{ runner.os == 'macOS' }}
        # A real .app wants a .icns; build a multi-size iconset from the 256 PNG and
        # let PyInstaller embed it. The path matches OV_ICON; off-mac this is a no-op
        # (the .icns check in the spec falls back to the PNG).
        run: |
          SRC="ownvoicereader/viewer/imgs/ownvoicereader-icon-256.png"
          ICONSET="build/icon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do sips -z "$s" "$s" "$SRC" --out "$ICONSET/icon_${s}x${s}.png"; done
          iconutil -c icns "$ICONSET" -o "$OV_ICON"
          echo "built $(du -h "$OV_ICON" | cut -f1) at $OV_ICON"

      - name: Build the bundle
        # macOS -> a real .app (BUNDLE); Linux/Windows -> a one-dir (COLLECT). The spec
        # branches on the platform; the same command drives both.
        run: pyinstaller --noconfirm --clean packaging/ownvoicereader.spec

      - name: Smoke — the bundled Piper synthesizes audio
        # Proves the self-contained TTS path end-to-end (the core value), on every OS,
        # by running the single binary in its Piper mode (smoke_tts.py finds the
        # per-platform executable and feeds it the PIPER_SENTINEL).
        run: python packaging/smoke_tts.py

      - name: Report bundle size
        # Shell-agnostic (works on Linux/macOS/Windows): a single Python one-liner,
        # no `du`/`||` (those don't exist in PowerShell).
        run: |
          python -c "
          import pathlib
          root = pathlib.Path('dist')
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file() and p.stat().st_size)
          n = sum(1 for p in root.rglob('*') if p.is_file())
          print(f'bundle: {n} files, {total/1e9:.2f} GB under dist/')
          "

      # --- the single native package per OS -----------------------------------
      # Linux ships BOTH: the AppImage (run it anywhere, no install) and a .deb
      # (the native one-click installer for Ubuntu/Debian: double-click -> install).
      - name: Package — AppImage + .deb (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          bash packaging/make_appimage.sh
          bash packaging/make_deb.sh

      - name: Package — .dmg of the .app (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash packaging/make_dmg.sh

      - name: Package — Inno Setup installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        # The `&` (PowerShell call operator) at a scalar start is a YAML anchor, so use
        # a literal block scalar to keep it literal.
        run: |
          & ./packaging/make_installer.ps1

      - name: Upload the native package
        uses: actions/upload-artifact@v4
        with:
          # One native package per OS; each runner produces only its own, so ignore the
          # paths that don't exist on this runner (the packaging step above guarantees
          # the matching one was produced, or it would have failed the job).
          name: package-${{ runner.os }}
          if-no-files-found: ignore
          # Each OS produces exactly one native package; the others are skipped.
          path: |
            dist/OwnVoiceReader-x86_64.AppImage
            dist/ownvoicereader_0.1.0_amd64.deb
            dist/OwnVoiceReader-arm64.dmg
            dist/OwnVoiceReader-Setup-x86_64.exe

  # --------------------------------------------------------------------------
  # 3) Publish to the GitHub Release page — only on a v* tag (manual dispatch
  #    builds + uploads artifacts but does NOT publish, so you can check a build
  #    without cutting a release).
  # --------------------------------------------------------------------------
  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update the release
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      - name: Publish to the GitHub Release page
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: false
