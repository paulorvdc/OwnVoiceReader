[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ownvoicereader"
version = "0.1.0"
description = "your model, your voice, your machine — a local LLM-based paper reader that explains figures/tables when referenced"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Paulo Viviurka do Carmo" }]
keywords = ["pdf", "tts", "llm", "reader", "accessibility", "ollama", "piper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: PDF",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

# Core = everything the app needs to run local/offline. Piper TTS is in core
# because the tool's whole point is *cloud-free* voice; a voice model is
# downloaded to a cache dir on first use (see voice/tts_engine.py). Heavy
# extras (OCR, a vision LLM) stay gated so a bare install stays light.
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "piper-tts>=1.2",
    # M4: the config file (~/.ownvoicereader/config.yaml) is written/read by the
    # "Save settings" button and the layering (defaults -> yaml -> env -> CLI).
    "pyyaml>=6",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "websockets>=12", "python-multipart>=0.0.9"]
# Local OCR fallback (A4) when a page's text layer is sparse (M3). `rapidocr`
# (the maintained successor to rapidocr-onnxruntime; the -onnxruntime line caps
# at Python <3.13) is the default; pytesseract drives the system tesseract binary
# as the alt.
ocr = ["rapidocr>=3.0", "pytesseract>=0.3"]
# Vision-capable LLM for figure explanation (A2 fallback covers non-vision).
# The client talks to a *local* Ollama server via the `ollama` library (M2.5);
# the default model is `lfm3-vl:2b`. No cloud, no litellm, no httpx.
vision = ["ollama>=0.6"]
test = ["pytest>=8"]
# M6 desktop host: open the viewer in its own native window via pywebview's Qt
# backend (QtWebEngine) — self-contained, so a packaged binary bundles it cleanly.
# A packaged build installs `all` + `desktop` (core + vision + ocr + the window).
desktop = [
    "pywebview>=6.2",
    "qtpy>=2.4",
    "PySide6>=6.6",
]
all = [
    "ownvoicereader[server,ocr,vision]",
]

[project.scripts]
ownvoicereader = "ownvoicereader.cli:main"

[project.urls]
Homepage = "https://github.com/pcarmo/OwnVoiceReader"

[tool.setuptools]
packages = [
    "ownvoicereader",
    "ownvoicereader.ingest",
    "ownvoicereader.reader",
    "ownvoicereader.llm",
    "ownvoicereader.voice",
    "ownvoicereader.server",
]

[tool.setuptools.package-data]
ownvoicereader = [
    "viewer/*.html",
    "viewer/*.js",
    "viewer/vendor/pdfjs/*.js",
    "viewer/vendor/phosphor/*",
    "viewer/imgs/*",
    # M6 Phase 2: the bundled default voice (en_US-lessac-medium) so a fresh install
    # reads out of the box, offline (copied into the user voice dir on first run).
    "voice/models/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
