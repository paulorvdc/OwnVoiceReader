[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ownvoicereader"
version = "0.1.0"
description = "your model, your voice, your machine — a local LLM-based paper reader that explains figures/tables when referenced"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Paulo Viviurka do Carmo" }]
keywords = ["pdf", "tts", "llm", "reader", "accessibility", "ollama", "litellm", "piper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: PDF",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

# Core = everything M0 (viewer + server) needs. Keep it light; heavy deps are
# gated behind extras so a local Ollama + Piper setup stays small.
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "jinja2>=3.1", "websockets>=12", "httpx>=0.27", "python-multipart>=0.0.9"]
# Local-first voice + OCR (A1/A4): Piper TTS, RapidOCR, pdfplumber tables.
local = ["piper-tts>=1.2", "rapidocr-onnxruntime>=1.3", "pdfplumber>=0.11"]
# Cloud LLM/TTS opt-in (A6): LiteLLM + provider SDKs.
cloud = ["litellm>=1.40", "openai>=1.30", "elevenlabs>=1.0"]
ocr = ["rapidocr-onnxruntime>=1.3", "pytesseract>=0.3"]
# Vision-capable LLMs for figure explanation (A2 fallback covers non-vision).
vision = ["litellm>=1.40"]
test = ["pytest>=8"]
all = [
    "ownvoicereader[server,local,cloud,ocr,vision]",
]

[project.scripts]
ownvoicereader = "ownvoicereader.cli:main"

[project.urls]
Homepage = "https://github.com/pcarmo/OwnVoiceReader"

[tool.setuptools]
packages = [
    "ownvoicereader",
    "ownvoicereader.ingest",
    "ownvoicereader.reader",
    "ownvoicereader.llm",
    "ownvoicereader.voice",
    "ownvoicereader.server",
]

[tool.setuptools.package-data]
ownvoicereader = [
    "viewer/*.html",
    "viewer/*.js",
    "viewer/vendor/pdfjs/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
