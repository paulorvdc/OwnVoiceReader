<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OwnVoiceReader</title>
  <!-- Vendored PDF.js (offline). Loaded before transport.js. -->
  <script src="/viewer/vendor/pdfjs/pdf.min.js"></script>
  <!-- M5 C7: one minimalist icon pack (Phosphor, regular weight) vendored for
       offline use — no CDN, no network. See vendor/phosphor/phosphor.css. -->
  <link rel="stylesheet" href="/viewer/vendor/phosphor/phosphor.css" />
  <style>
    /* M5 C2: three colour schemes, all keyed off <html data-theme>. Light
       high-contrast is the default (the low-vision primary target); the header
       button cycles light → dark (high-contrast) → Dracula and persists the pick.
       `--on-accent` is the text colour to place *on* an --accent fill. */
    :root,
    [data-theme="light"] {
      --bg: #f5f7fa;      /* light desk — the white PDF page pops against it */
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --fg: #000000;
      --fg-dim: #333333;
      --accent: #0044cc;
      --accent-dim: #dbe7fb;
      --on-accent: #ffffff;
      --ok: #0a7d2c;
      --warn: #8a5a00;
      --err: #b30000;
      --border: #1a1a1a;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --bg-elev: #0d0d0d;
      --bg-card: #161616;
      --fg: #ffffff;
      --fg-dim: #d0d0d0;
      --accent: #8ec5ff;
      --accent-dim: #16305c;
      --on-accent: #000000;
      --ok: #46d97a;
      --warn: #f0b429;
      --err: #ff5c5c;
      --border: #4a4a4a;
    }
    [data-theme="dracula"] {
      --bg: #282a36;
      --bg-elev: #21222c;
      --bg-card: #343746;
      --fg: #f8f8f2;
      --fg-dim: #6272a4;
      --accent: #bd93f9;
      --accent-dim: #3d3a5a;
      --on-accent: #282a36;
      --ok: #50fa7b;
      --warn: #ffb86c;
      --err: #ff5555;
      --border: #44475a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
    }
    body { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: baseline; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--bg-elev); position: relative;
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
    .subtitle { color: var(--fg-dim); font-style: italic; }
    .doc-info { margin-left: auto; color: var(--fg-dim); font-size: 13px; text-align: right; }
    .doc-info .title { color: var(--fg); }
    .badge {
      display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px;
      font-size: 12px; background: var(--accent-dim); color: var(--accent);
      border: 1px solid var(--accent);
    }
    /* Status badges keep the theme-adaptive accent chip but take a coloured border
       to signal on/off, so they read on any of the three schemes. */
    .badge.env, .badge.vision { border-color: var(--ok); }
    .badge.vision-off, .badge.off { border-color: var(--err); }

    .screen { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .hidden { display: none !important; }

    /* Landing / drop zone */
    #landing { display: grid; place-items: center; }
    .drop {
      width: min(560px, 90vw); text-align: center;
      border: 2px dashed var(--border); border-radius: 14px;
      padding: 48px 24px; background: var(--bg-card);
      transition: border-color .15s, background .15s;
    }
    .drop.dragover { border-color: var(--accent); background: var(--accent-dim); }
    .drop-title { font-size: 20px; margin: 0 0 6px; }
    .drop-sub { color: var(--fg-dim); margin: 0 0 16px; }
    .drop-hint { color: var(--fg-dim); margin: 16px 0 0; font-size: 12px; }
    code { background: var(--accent-dim); padding: 1px 5px; border-radius: 4px; color: var(--accent); }

    button {
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: 16px; cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #open-btn { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
    /* M5 C7: one minimalist Phosphor pack (regular weight) across every control.
       The glyph is a font, so it follows the current theme colour automatically.
       Icon-only buttons get a uniform square so a cluster reads as one consistent
       row; a glyph beside a word (Refresh / Save) just sits to the left of it. */
    .ph { font-size: 18px; line-height: 1; vertical-align: -0.15em; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .group > button.icon-btn { width: 44px; height: 44px; padding: 0; }
    .group > button.icon-btn .ph { font-size: 20px; }
    /* M5 C2/C7: the header toggles — square icon buttons (the ☰ settings + the
       single 📄/📖 cycler + the theme cycle). */
    .theme-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; line-height: 1; padding: 0;
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .theme-btn .ph { font-size: 20px; }

    /* Reader */
    #pdf-wrap { display: grid; place-items: start center; padding: 16px; flex: 1 1 auto; min-width: 0; overflow: auto; }
    #pdf-canvas {
      display: block;
      background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      border-radius: 2px; max-width: 100%;
    }

    /* Control bar */
    footer#controls {
      display: flex; align-items: center; justify-content: center; gap: 18px;
      padding: 10px 16px; border-top: 1px solid var(--border);
      background: var(--bg-elev); flex-wrap: wrap;
    }
    .group { display: flex; align-items: center; gap: 8px; }
    .group > button { padding: 6px 10px; }
    .group input[type=number] {
      width: 44px; background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; text-align: center; padding: 4px;
    }
    .group > span { color: var(--fg-dim); }
    #zoom-label { min-width: 48px; text-align: center; color: var(--fg-dim); }
    .voice-controls.disabled { opacity: 0.5; }
    /* M4: the local-only checkbox + the "Save settings" button in the settings group. */
    .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 15px;
           color: var(--fg-dim); cursor: pointer; }
    .chk input { accent-color: var(--accent); }
    /* M5 C7: the local-only toggle lives *inside* the vision group (it governs
       whether any cloud egress — incl. vision — is allowed) and matches that
       group's control style, with a full-contrast label for the low-vision target. */
    .set-group .chk.local { color: var(--fg); font-weight: 600; margin-top: 12px; }
    .set-group .chk.local input { width: 18px; height: 18px; accent-color: var(--accent); }
    /* M5 C7: "Save settings" pairs a Phosphor glyph with a word, so it sizes to
       its text and matches the rest of the settings controls. */
    #save-settings { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; padding: 4px 10px; }
    #save-settings .ph { font-size: 16px; }
    /* M4: the Ollama host input + the "Refresh models" button in the settings group. */
    #ollama-host {
      width: 170px; background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 15px;
    }
    #refresh-models { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; padding: 4px 10px; }
    #refresh-models .ph { font-size: 16px; }
    select {
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 15px;
    }
    .progress { font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; color: var(--fg-dim); }
    .m1-note { color: var(--warn); font-size: 11px; }

    /* Reader layout (M5 C5): a 3-column row — the settings side bar on the LEFT
       (a 420px card), the PDF in the middle, and the "now reading" follow-along
       panel on the RIGHT (a 500px card of the same aesthetic). As the window
       narrows the settings card collapses first (burger overlay), then the PDF
       (the now-reading stays). */
    #reader { display: flex; flex-direction: row; min-height: 0; overflow: hidden; position: relative; }

    /* M5 C5: the settings side bar — a 420px card, same aesthetic as the now-reading
       panel, on the left of the PDF. It mirrors the now-reading's thick INNER
       margin (thicker on the right here, toward the PDF), so the two cards float
       toward the centre. It collapses to a burger-toggled overlay first. */
    #settings {
      flex: 0 0 420px; margin: 16px 16px 16px 40px;
      display: flex; flex-direction: column; min-height: 0;
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
      background: var(--bg-elev); box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
    }
    .sidebar-head {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-elev);
    }
    .sidebar-head .label { color: var(--accent); font-weight: 600; font-size: 14px; white-space: nowrap; }
    /* the settings contents scroll if they exceed the card height */
    .set-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px; }
    .set-group { margin-bottom: 16px; }
    .set-group:last-child { margin-bottom: 0; }
    .set-group label { display: block; font-size: 14px; color: var(--fg-dim); margin-bottom: 4px; }
    .set-group select, .set-group input[type="text"] {
      width: 100%; background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 15px;
    }
    .set-group .chk { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--fg-dim); }
    .host-row { display: flex; gap: 6px; align-items: center; }
    .host-row input { flex: 1 1 auto; min-width: 0; }
    .host-row button { flex: 0 0 auto; white-space: nowrap; }
    /* the compact drop zone inside the settings card (the landing's .drop, smaller);
       width:100% so it fills the card rather than the landing's fixed 560px */
    .drop-sm { width: 100%; padding: 14px 12px; text-align: center; border-radius: 10px; }
    .drop-sm .drop-sub { margin: 0 0 8px; font-size: 15px; }
    .drop-sm button { width: 100%; }

    /* Header toggles: ☰ (settings overlay, far LEFT via order:-1) + the single
       📄/📖 panel cycler (CENTRALISED, like the theme button). Both hidden on wide
       screens; each appears only when its panel auto-collapses on a narrow window. */
    #burger { display: none; order: -1; }
    #panel-toggle { display: none; }

    /* M5 C3/C4: the "now reading" panel is a lyrics-style follow-along transcript
       (Apple-Music style) — the cue being heard is enlarged + high-contrast in the
       middle, with the neighbouring cues dimmed + smaller around it. The low-vision
       user is the primary target, so the current line is large + high-contrast.
       It is a rounded, slightly-elevated card floating in the right of the reader
       with a margin all round — thicker on the right, so it sits more centrally
       rather than hugging the edge. */
    #lyrics {
      flex: 0 0 500px; margin: 16px 40px 16px 16px;
      display: flex; flex-direction: column; min-height: 0;
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
      background: var(--bg-elev); box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
    }
    .lyrics-head {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-elev);
    }
    .lyrics-head .label { color: var(--accent); font-weight: 600; font-size: 12px; white-space: nowrap; }
    .lyrics-head .section {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: var(--accent-dim); color: var(--accent);
      padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    }
    .lyrics-head .section:empty { display: none; }
    /* Wide layout: a scrolling window of cues; the current one is enlarged +
       high-contrast and centred, the neighbours dimmed + smaller. */
    .lyrics-list {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 0; text-align: center;
    }
    .lyrics-list .line {
      padding: 6px 18px; font-size: 15px; line-height: 1.5; color: var(--fg-dim);
    }
    .lyrics-list .line.current {
      font-size: 24px; font-weight: 600; color: var(--fg);
      background: var(--accent-dim); border-radius: 8px; margin: 2px 10px; padding: 12px 18px;
    }
    /* M2.5: a figure/table explanation is a side-note the reader diverts to — the
       body reads as an italic aside; the spoken markers ("Now, a closer look…" /
       "Back to the text.") are accented + bold so they stand out. */
    .lyrics-list .line.notice { color: var(--warn); font-style: italic; }
    .lyrics-list .line.explain { font-style: italic; }
    .lyrics-list .line.explain-marker { color: var(--accent); font-weight: 600; }
    /* #lyrics-now (the single-line current cue) is kept in the DOM as a fallback
       but is no longer shown — the now-reading panel now stays as a side card
       (M5 C5) instead of collapsing to a bottom line. */
    .lyrics-now { display: none; }
    /* M5 C6: the figure/table being explained — its cropped image (a figure) or its
       cell grid rendered as a markdown table — shown in the now-reading panel below
       the head while an explanation plays, and hidden (via the global .hidden rule)
       when the prose resumes. It caps at ~45% of the panel so the transcript keeps
       scrolling beneath it. */
    .lyrics-media {
      flex: 0 0 auto; max-height: 45%; overflow-y: auto;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .lyrics-media .media-title {
      font-size: 15px; font-weight: 600; color: var(--accent);
      margin-bottom: 6px; line-height: 1.3;
    }
    .lyrics-media .media-figure {
      max-width: 100%; height: auto; display: block; margin: 0 auto;
      border: 1px solid var(--border); border-radius: 8px; background: #fff;
    }
    .lyrics-media .media-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .lyrics-media .media-table th,
    .lyrics-media .media-table td {
      border: 1px solid var(--border); padding: 4px 8px;
      text-align: left; vertical-align: top;
    }
    .lyrics-media .media-table th { background: var(--bg-elev); font-weight: 600; }

    /* M5 C5 responsive collapse — the side cards give way in this order as the
       window narrows: (1) the thick inner margins shrink first, (2) the SETTINGS
       card collapses to a burger-toggled overlay (it yields before the now-reading),
       (3) the PDF collapses last and the now-reading takes the full width. */
    @media (max-width: 1280px) {
      /* the thick inner margins (the side facing the PDF) shrink first */
      #settings { margin-left: 16px; }
      #lyrics { margin-right: 16px; }
    }
    @media (max-width: 1080px) {
      /* the settings card collapses to a burger-toggled overlay; the ☰ in the
         header re-opens it as a slide-over from the left. Anchored to #reader
         (position: relative above), not the viewport, so it stays *below* the
         header and the ☰ stays clickable to close it. */
      #settings {
        position: absolute; top: 0; left: 0; width: 420px; max-width: 90vw;
        height: 100%; z-index: 60; margin: 0; border-radius: 0;
        transform: translateX(-100%); transition: transform .2s ease;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
      }
      #reader.settings-open #settings { transform: translateX(0); }
      #burger { display: inline-block; }
    }
    @media (max-width: 900px) {
      /* the PDF collapses last; the now-reading stays and takes the full width.
         The two are mutually exclusive: showing the PDF collapses the 'now reading'
         panel (so the page fills the space instead of being squeezed by it), and the
         single 📄/📖 cycler in the header swaps between them. */
      #pdf-wrap { display: none; }
      #lyrics { flex: 1 1 auto; margin: 0; }
      #reader.pdf-shown #pdf-wrap { display: grid; }
      #reader.pdf-shown #lyrics { display: none; }
      /* the cycler is centralised in the header, just like the theme button */
      #panel-toggle {
        display: inline-block; position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%); z-index: 5;
      }
    }

    /* Status line */
    .status {
      padding: 4px 16px; font-size: 12px; color: var(--fg-dim);
      background: var(--bg); border-top: 1px solid var(--border);
      min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status.err { color: var(--err); }
    .status.ok { color: var(--ok); }
  </style>
  <script>
    /* M5 C2: apply the saved theme before first paint so a stored scheme (e.g.
       Dracula) doesn't flash as the light default on reload. transport.js reads
       the same key ("ownvoicereader.theme") to sync the button + persist on cycle. */
    (function () {
      var t;
      try { t = localStorage.getItem("ownvoicereader.theme"); } catch (e) { t = null; }
      document.documentElement.setAttribute(
        "data-theme",
        t === "light" || t === "dark" || t === "dracula" ? t : "light"
      );
    })();
  </script>
</head>
<body>
  <header>
    <h1>OwnVoiceReader</h1>
    <span class="subtitle">your model, your voice, your machine</span>
    <div class="doc-info" id="doc-info"></div>
    <button id="burger" class="theme-btn" title="Settings panel" aria-label="Toggle settings panel"><i class="ph ph-list"></i></button>
    <button id="panel-toggle" class="theme-btn" title="Switch between the PDF page and the 'now reading' panel" aria-label="Toggle PDF / reading panel"><i class="ph ph-book-open"></i></button>
    <button id="theme-btn" class="theme-btn" title="Theme (light / dark / Dracula)" aria-label="Cycle theme"><i class="ph ph-sun"></i></button>
  </header>

  <!-- Landing (no document loaded) -->
  <section id="landing" class="screen">
    <div id="drop" class="drop">
      <p class="drop-title">Drop a PDF here</p>
      <p class="drop-sub">or</p>
      <button id="open-btn">Open a PDF…</button>
      <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
      <p class="drop-hint">…or run <code>ownvoicereader paper.pdf</code> to open one directly.</p>
    </div>
  </section>

  <!-- Reader: a 3-column row — settings side bar (left), PDF (middle), "now
       reading" follow-along panel (right, a lyrics-style transcript). As the window
       narrows the settings card collapses first (burger overlay), then the PDF; the
       now-reading stays (M5 C5). -->
  <section id="reader" class="screen hidden">
    <!-- Settings side bar (M5 C5): a 420px card, same aesthetic as the now-reading
         panel, on the left of the PDF. It collapses to a burger-toggled overlay
         (header ☰) *before* the now-reading does; the PDF collapses last (header
         📄 brings it back). -->
    <aside id="settings" aria-label="Settings">
      <div class="sidebar-head"><span class="label">SETTINGS</span></div>
      <div class="set-body">
        <!-- (1) drag-and-drop + open, like the landing screen -->
        <div id="set-drop" class="drop drop-sm">
          <p class="drop-sub">Drop a PDF here, or</p>
          <button id="set-open-btn">Open a PDF…</button>
        </div>
        <!-- (2) voice + style -->
        <div class="set-group">
          <label for="voice-select">Voice</label>
          <select id="voice-select" title="Voice" disabled></select>
          <label for="style-select">Reader style</label>
          <select id="style-select" title="Reader style" disabled></select>
        </div>
        <!-- (3) vision: host + refresh on one row, then the Ollama model list,
             then the local-only toggle (kept *here*, with the vision block, since
             it governs whether any cloud egress — incl. vision — is allowed) -->
        <div class="set-group" id="vision-group">
          <label for="ollama-host">Ollama host</label>
          <div class="host-row">
            <input type="text" id="ollama-host"
                   title="Ollama server the vision LLM talks to (the 'Refresh' button re-points + re-probes it)"
                   placeholder="http://localhost:11434" disabled />
            <button id="refresh-models"
                    title="Point the vision LLM at the host typed here and refresh the model list" disabled><i class="ph ph-arrow-clockwise"></i> Refresh</button>
          </div>
          <label for="model-select">Ollama models</label>
          <select id="model-select" title="Vision / LLM model (local Ollama)" disabled></select>
          <label class="chk local" title="Forbid any cloud egress (local-only — the default)">
            <input type="checkbox" id="local-only-chk" checked> local-only
          </label>
        </div>
        <!-- (4) save settings -->
        <div class="set-group">
          <button id="save-settings" title="Save these settings to the config file" disabled><i class="ph ph-floppy-disk"></i> Save</button>
        </div>
      </div>
    </aside>
    <div id="pdf-wrap">
      <canvas id="pdf-canvas"></canvas>
    </div>
    <aside id="lyrics" aria-label="Now reading — follow-along transcript">
      <div class="lyrics-head">
        <span class="label">NOW READING</span>
        <span class="section" id="now-section" title="current section"></span>
      </div>
      <!-- M5 C6: the figure/table being explained — its cropped image (a figure)
           or its cell grid as a markdown table (a table) — shown below the head
           while an explanation plays; hidden when the prose resumes. -->
      <div id="lyrics-media" class="lyrics-media hidden" aria-label="Figure or table being explained"></div>
      <div id="lyrics-list" class="lyrics-list"></div>
      <div id="lyrics-now" class="lyrics-now">…</div>
    </aside>
  </section>

  <!-- Control bar (shown once a document is loaded) -->
  <footer id="controls" class="hidden">
    <div class="group" title="page navigation">
      <button id="prev-page" class="icon-btn" title="Previous page (←)" aria-label="Previous page"><i class="ph ph-caret-left"></i></button>
      <input id="page-input" type="number" min="1" value="1" title="Go to page" aria-label="Go to page number" />
      <span>/</span>
      <span id="page-count">–</span>
      <button id="next-page" class="icon-btn" title="Next page (→)" aria-label="Next page"><i class="ph ph-caret-right"></i></button>
    </div>
    <div class="group" title="zoom">
      <button id="zoom-out" class="icon-btn" title="Zoom out (−)" aria-label="Zoom out"><i class="ph ph-magnifying-glass-minus"></i></button>
      <button id="zoom-fit" class="icon-btn" title="Fit to screen (width)" aria-label="Fit to screen"><i class="ph ph-arrows-in"></i></button>
      <button id="zoom-in" class="icon-btn" title="Zoom in (+)" aria-label="Zoom in"><i class="ph ph-magnifying-glass-plus"></i></button>
      <span id="zoom-label">…</span>
    </div>

    <div class="group voice-controls disabled" id="voice-controls"
         title="Reading controls — start/stop the paper being read aloud">
      <button id="btn-replay" class="icon-btn" title="Back one section (double-click: skip a whole section)" aria-label="Back one section"><i class="ph ph-skip-back"></i></button>
      <button id="btn-prev-cue" class="icon-btn" title="Back one paragraph" aria-label="Back one paragraph"><i class="ph ph-caret-double-left"></i></button>
      <button id="btn-play" class="icon-btn" title="Play / Pause (space)" aria-label="Play or pause"><i class="ph ph-play"></i></button>
      <button id="btn-stop" class="icon-btn" title="Stop / reset" aria-label="Stop and reset"><i class="ph ph-stop"></i></button>
      <button id="btn-next-cue" class="icon-btn" title="Forward one paragraph" aria-label="Forward one paragraph"><i class="ph ph-caret-double-right"></i></button>
      <button id="btn-next" class="icon-btn" title="Forward to next section" aria-label="Forward to next section"><i class="ph ph-skip-forward"></i></button>
      <span class="progress" id="progress" title="reading position">–</span>
    </div>

  </footer>

  <!-- The "now reading" follow-along now lives inside the reader (the #lyrics
       panel above), not as a separate bar + toggleable block (M5 C3/C4). -->

  <div id="status" class="status">starting…</div>

  <audio id="audio-out" preload="auto"></audio>

  <script src="/viewer/transport.js"></script>
</body>
</html>
