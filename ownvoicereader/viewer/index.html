<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OwnVoiceReader</title>
  <!-- Vendored PDF.js (offline). Loaded before transport.js. -->
  <script src="/viewer/vendor/pdfjs/pdf.min.js"></script>
  <style>
    /* M5 C2: three colour schemes, all keyed off <html data-theme>. Light
       high-contrast is the default (the low-vision primary target); the header
       button cycles light → dark (high-contrast) → Dracula and persists the pick.
       `--on-accent` is the text colour to place *on* an --accent fill. */
    :root,
    [data-theme="light"] {
      --bg: #f5f7fa;      /* light desk — the white PDF page pops against it */
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --fg: #000000;
      --fg-dim: #333333;
      --accent: #0044cc;
      --accent-dim: #dbe7fb;
      --on-accent: #ffffff;
      --ok: #0a7d2c;
      --warn: #8a5a00;
      --err: #b30000;
      --border: #1a1a1a;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --bg-elev: #0d0d0d;
      --bg-card: #161616;
      --fg: #ffffff;
      --fg-dim: #d0d0d0;
      --accent: #8ec5ff;
      --accent-dim: #16305c;
      --on-accent: #000000;
      --ok: #46d97a;
      --warn: #f0b429;
      --err: #ff5c5c;
      --border: #4a4a4a;
    }
    [data-theme="dracula"] {
      --bg: #282a36;
      --bg-elev: #21222c;
      --bg-card: #343746;
      --fg: #f8f8f2;
      --fg-dim: #6272a4;
      --accent: #bd93f9;
      --accent-dim: #3d3a5a;
      --on-accent: #282a36;
      --ok: #50fa7b;
      --warn: #ffb86c;
      --err: #ff5555;
      --border: #44475a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    body { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: baseline; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }
    header h1 { font-size: 17px; margin: 0; letter-spacing: 0.5px; }
    .subtitle { color: var(--fg-dim); font-style: italic; }
    .doc-info { margin-left: auto; color: var(--fg-dim); font-size: 12px; text-align: right; }
    .doc-info .title { color: var(--fg); }
    .badge {
      display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px;
      font-size: 11px; background: var(--accent-dim); color: var(--accent);
      border: 1px solid var(--accent);
    }
    /* Status badges keep the theme-adaptive accent chip but take a coloured border
       to signal on/off, so they read on any of the three schemes. */
    .badge.env, .badge.vision { border-color: var(--ok); }
    .badge.vision-off, .badge.off { border-color: var(--err); }

    .screen { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .hidden { display: none !important; }

    /* Landing / drop zone */
    #landing { display: grid; place-items: center; }
    .drop {
      width: min(560px, 90vw); text-align: center;
      border: 2px dashed var(--border); border-radius: 14px;
      padding: 48px 24px; background: var(--bg-card);
      transition: border-color .15s, background .15s;
    }
    .drop.dragover { border-color: var(--accent); background: var(--accent-dim); }
    .drop-title { font-size: 20px; margin: 0 0 6px; }
    .drop-sub { color: var(--fg-dim); margin: 0 0 16px; }
    .drop-hint { color: var(--fg-dim); margin: 16px 0 0; font-size: 12px; }
    code { background: var(--accent-dim); padding: 1px 5px; border-radius: 4px; color: var(--accent); }

    button {
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: 14px; cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #open-btn { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
    /* M5 C2: the header theme toggle (sun / moon / vampire emoji). */
    .theme-btn {
      font-size: 16px; line-height: 1; padding: 4px 8px;
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }

    /* Reader */
    #pdf-wrap { display: grid; place-items: start center; padding: 16px; }
    #pdf-canvas {
      display: block;
      background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      border-radius: 2px; max-width: 100%;
    }

    /* Control bar */
    footer#controls {
      display: flex; align-items: center; gap: 18px;
      padding: 10px 16px; border-top: 1px solid var(--border);
      background: var(--bg-elev); flex-wrap: wrap;
    }
    .group { display: flex; align-items: center; gap: 8px; }
    .group > button { padding: 6px 10px; }
    .group input[type=number] {
      width: 44px; background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; text-align: center; padding: 4px;
    }
    .group > span { color: var(--fg-dim); }
    #zoom-label { min-width: 48px; text-align: center; color: var(--fg-dim); }
    .voice-controls { margin-left: auto; }
    .voice-controls.disabled { opacity: 0.5; }
    /* M4: the local-only checkbox + the "Save settings" button in the settings group. */
    .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 13px;
           color: var(--fg-dim); cursor: pointer; }
    .chk input { accent-color: var(--accent); }
    #save-settings { font-size: 13px; padding: 4px 10px; }
    /* M4: the Ollama host input + the "Refresh models" button in the settings group. */
    #ollama-host {
      width: 170px; background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 13px;
    }
    #refresh-models { font-size: 13px; padding: 4px 10px; }
    select {
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 13px;
    }
    .progress { font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; color: var(--fg-dim); }
    .m1-note { color: var(--warn); font-size: 11px; }

    /* "Now reading" bar */
    #now-reading {
      padding: 8px 16px; border-top: 1px solid var(--border);
      background: var(--bg-card); font-size: 14px; color: var(--fg);
      min-height: 30px; display: flex; align-items: center; gap: 10px;
    }
    #now-reading .label { color: var(--accent); font-weight: 600; white-space: nowrap; }
    #now-reading .section {
      flex: 0 0 auto; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: var(--accent-dim); color: var(--accent);
      padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    }
    #now-reading .section:empty { display: none; }
    #now-reading .text { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Transcript panel */
    #transcript-toggle { font-size: 12px; padding: 3px 10px; }
    #transcript {
      max-height: 0; overflow-y: auto; border-top: 1px solid var(--border);
      background: var(--bg); transition: max-height .2s;
    }
    #transcript.open { max-height: 38vh; }
    #transcript .line { padding: 3px 16px; font-size: 13px; color: var(--fg-dim); }
    #transcript .line.current { color: var(--fg); background: var(--accent-dim); }
    #transcript .line.notice { color: var(--warn); font-style: italic; }
    /* M2.5: a figure/table explanation is a side-note the reader diverts to — the
       body reads as an italic aside; the spoken markers ("Now, a closer look…" /
       "Back to the text.") are accented + bold so they stand out. */
    #transcript .line.explain { font-style: italic; }
    #transcript .line.explain-marker { color: var(--accent); font-weight: 600; }

    /* Status line */
    .status {
      padding: 4px 16px; font-size: 12px; color: var(--fg-dim);
      background: var(--bg); border-top: 1px solid var(--border);
      min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status.err { color: var(--err); }
    .status.ok { color: var(--ok); }
  </style>
  <script>
    /* M5 C2: apply the saved theme before first paint so a stored scheme (e.g.
       Dracula) doesn't flash as the light default on reload. transport.js reads
       the same key ("ownvoicereader.theme") to sync the button + persist on cycle. */
    (function () {
      var t;
      try { t = localStorage.getItem("ownvoicereader.theme"); } catch (e) { t = null; }
      document.documentElement.setAttribute(
        "data-theme",
        t === "light" || t === "dark" || t === "dracula" ? t : "light"
      );
    })();
  </script>
</head>
<body>
  <header>
    <h1>OwnVoiceReader</h1>
    <span class="subtitle">your model, your voice, your machine</span>
    <div class="doc-info" id="doc-info"></div>
    <button id="theme-btn" class="theme-btn" title="Theme (light / dark / Dracula)" aria-label="Cycle theme">🌞</button>
  </header>

  <!-- Landing (no document loaded) -->
  <section id="landing" class="screen">
    <div id="drop" class="drop">
      <p class="drop-title">Drop a PDF here</p>
      <p class="drop-sub">or</p>
      <button id="open-btn">Open a PDF…</button>
      <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
      <p class="drop-hint">…or run <code>ownvoicereader paper.pdf</code> to open one directly.</p>
    </div>
  </section>

  <!-- Reader -->
  <section id="reader" class="screen hidden">
    <div id="pdf-wrap">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </section>

  <!-- Control bar (shown once a document is loaded) -->
  <footer id="controls" class="hidden">
    <div class="group" title="page navigation">
      <button id="prev-page" title="Previous page (←)">◀</button>
      <input id="page-input" type="number" min="1" value="1" title="Go to page" />
      <span>/</span>
      <span id="page-count">–</span>
      <button id="next-page" title="Next page (→)">▶</button>
    </div>
    <div class="group" title="zoom">
      <button id="zoom-out" title="Zoom out (−)">−</button>
      <button id="zoom-fit" title="Fit width">Fit</button>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <span id="zoom-label">110%</span>
    </div>

    <div class="group voice-controls disabled" id="voice-controls"
         title="Reading controls — start/stop the paper being read aloud">
      <button id="btn-replay" title="Back one section (double-click: skip a whole section)">⏮</button>
      <button id="btn-prev-cue" title="Back one paragraph">⏪</button>
      <button id="btn-play" title="Play / Pause (space)">▶</button>
      <button id="btn-stop" title="Stop / reset">⏹</button>
      <button id="btn-next-cue" title="Forward one paragraph">⏩</button>
      <button id="btn-next" title="Forward to next section">⏭</button>
      <span class="progress" id="progress" title="reading position">–</span>
    </div>

    <div class="group voice-controls" id="voice-settings">
      <select id="model-select" title="Vision / LLM model (local Ollama)" disabled></select>
      <select id="style-select" title="Reader style" disabled></select>
      <select id="voice-select" title="Voice" disabled></select>
      <input type="text" id="ollama-host"
             title="Ollama server the vision LLM talks to (the 'Refresh' button re-points + re-probes it)"
             placeholder="http://localhost:11434" disabled />
      <button id="refresh-models"
              title="Point the vision LLM at the host typed here and refresh the model list" disabled>⟳ Refresh</button>
      <label class="chk" title="Forbid any cloud egress (local-only — the default)">
        <input type="checkbox" id="local-only-chk" checked> local-only
      </label>
      <button id="save-settings" title="Save these settings to the config file" disabled>💾 Save</button>
    </div>

    <div class="group" title="Load a different PDF without restarting the server">
      <button id="change-pdf" title="Change PDF — load a different file on the fly">Change PDF…</button>
    </div>
  </footer>

  <!-- "Now reading" + transcript -->
  <div id="now-reading" class="hidden">
    <span class="label">NOW READING</span>
    <span class="section" id="now-section" title="current section"></span>
    <span class="text" id="now-text">…</span>
    <button id="transcript-toggle" title="Toggle transcript">transcript ▾</button>
  </div>
  <div id="transcript"></div>

  <div id="status" class="status">starting…</div>

  <audio id="audio-out" preload="auto"></audio>

  <script src="/viewer/transport.js"></script>
</body>
</html>
